name: Sondeo de salas
on:
  push:
    branches: [sondeo]
    paths: [sondeo/urls.txt, sondeo/sondeo.py, .github/workflows/sondeo.yml]
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: cd sondeo && python sondeo.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sondeo/sondeo.json sondeo/raw || true
          git commit -m "Resultado sondeo" && git push
