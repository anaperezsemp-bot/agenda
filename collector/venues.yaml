    fuente: html
    url: https://www.salaelsotano.com/
    solo_categorias: [conciertos]
    html:
      bloque: 'class="evento-club-item \w+Type'
      generos: 'class="evento-club-item (\w+)Type'
      titulo: '<h3>(.*?)</h3>'
      fecha: 'class="evento-club-fecha">(.*?)</p>'
      hora: 'class="evento-club-fecha">(.*?)</p>'
      entradas: 'class="evento-club-boton" href="([^"]+)"'
      imagen: '<img[^>]+src="([^"]+)"'
  - id: wurlitzer
    nombre: Wurlitzer Ballroom
    barrio: Centro
    web: https://wurlitzerballroom.com/agenda
    fuente: html
    url: https://wurlitzerballroom.com/agenda
    html:
      bloque: '<article class="flyer'
      titulo: '<h3[^>]*>(.*?</h3>(?:<p class="mt-2 font-display[^"]*">.*?</p>)?)'
      fecha: 'href="/concierto/[^"]*?(\d{4}-\d{2}-\d{2})"'
      hora: 'Puertas ([0-9:.]+)'
      precio: 'class="mark-fluor">([^<]*)<'
      enlace: '<h3[^>]*>\s*<a[^>]+href="([^"]+)"'
      entradas: 'href="(https?://[^"]+)"[^>]*>Entradas'
      generos: 'gap-y-1 text-muted-foreground">(.*?)</p>'
