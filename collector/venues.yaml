# Salas que sigue la agenda.
# fuente:
#   tec   -> plugin The Events Calendar de WordPress (API /wp-json/tribe/events/v1/events)
#   rss   -> feed RSS (p. ej. la categoría "conciertos" de un WordPress)
#   jsonld -> página con datos schema.org Event / MusicEvent
#   madridenvivo -> agenda de la asociación Madrid en Vivo (mev = id de la sala allí)
#   pendiente -> todavía sin lector; la sala no aporta conciertos todavía
# Opcionales: excluir_categorias (quita, p. ej., las sesiones de DJ) y
# solo_categorias (se queda solo con esas categorías de la sala).
# Las salas "pendiente" se irán activando una a una (ver README.md).

salas:
  - id: cafe-la-palma
    nombre: Café La Palma
    barrio: Malasaña
    web: https://cafelapalma.com/agenda-de-conciertos/
    fuente: tec
    base: https://cafelapalma.com
    solo_categorias: [Concierto]

  - id: la-riviera
    nombre: La Riviera
    barrio: Arganzuela
    web: https://salariviera.com/conciertossalariviera/
    fuente: tec
    base: https://salariviera.com

  - id: el-perro-club
    nombre: El Perro Club
    barrio: Malasaña
    web: https://elperroclub.es/conciertos/
    fuente: tec
    base: https://elperroclub.es
    excluir_categorias: [DJs]

  - id: maravillas
    nombre: Maravillas Club
    barrio: Malasaña
    web: https://www.maravillasclub.com/category/conciertos/
    fuente: rss
    url: https://www.maravillasclub.com/category/conciertos/feed/

  - id: galileo
    nombre: Sala Galileo Galilei
    barrio: Chamberí
    web: https://salagalileo.es/programacion/
    fuente: madridenvivo
    mev: 61584

  - id: cafe-berlin
    nombre: Café Berlín
    barrio: Centro
    web: https://berlincafe.es/programas/
    fuente: madridenvivo
    mev: 61554
  - id: sala-but
    nombre: Sala But
    barrio: Malasaña
    web: https://www.salabut.es/agenda-conciertos/
    fuente: html
    url: https://www.salabut.es/agenda-conciertos/
    html:
      bloque: 'class="elementor-element elementor-element-\w+ e-con-full e-grid'
      titulo: 'elementor-heading-title[^>]*>(.*?)</span>'
      fecha: 'elementor-heading-title[^>]*>.*?</span>.*?elementor-heading-title[^>]*>(.*?)</span>'
      entradas: 'class="elementor-button elementor-button-link[^"]*" href="([^"]+)"'
      imagen: '<img[^>]+src="([^"]+)"'
  - id: copernico
    nombre: Copérnico
    barrio: Chamberí
    web: https://conciertoscopernico.com/conciertos-copernico/
    fuente: html
    url: https://conciertoscopernico.com/conciertos-copernico/
    html:
      bloque: '<article id="blog-'
      titulo: '<h2 class="blog-shortcode-post-title[^>]*>(.*?)</h2>'
      fecha: '<h2 class="blog-shortcode-post-title[^>]*>(.*?)</h2>'
      quitar: '\s*[–-]\s*\d{1,2}\s*(de\s+)?[a-záéíóú]+\s*$'
      enlace: '<h2 class="blog-shortcode-post-title[^>]*>\s*<a href="([^"]+)"'
      imagen: '<img[^>]+src="([^"]+)"'
  - id: el-sol
    nombre: Sala El Sol
    barrio: Centro
    web: https://salaelsol.com/agenda/
    fuente: html
    url: https://salaelsol.com/agenda/
    solo_categorias: [Conciertos]
    html:
      bloque: 'class="agenda gran-contenedor-agenda'
      generos: 'class="categoria-12">(.*?)</strong>'
      titulo: 'class="nombre_evento">(.*?)</p>'
      fecha: 'class="fecha-superior">(.*?)</p>'
      hora: 'class="espacio">(.*?)</span>'
      enlace: 'class="nombre_evento"><a href="([^"]+)"'
      entradas: 'href="([^"]+)" class="Tickets"'
      imagen: '<img[^>]+src="([^"]+)"'
  - id: siroco
    nombre: Siroco
    barrio: Malasaña
    web: https://siroco.es/conciertos/
    fuente: madridenvivo
    mev: 61619
  - id: fun-house
